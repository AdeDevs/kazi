<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The landing page's hero skyline is its largest image. Start downloading it alongside the
      // app's JavaScript instead of after it; other pages don't need it, so only on "/".
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.href = '/landing/ibadan-skyline-3.svg'; l.fetchPriority = 'high';
        document.head.appendChild(l);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <title>KaziHub</title>
    <meta name="description" content="KaziHub connects verified electricians, plumbers, AC technicians, solar installers, and carpenters with clients across all 36 Nigerian states." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
