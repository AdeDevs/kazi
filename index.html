<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The landing page's hero art is its largest image. Start downloading it alongside the app's
      // JavaScript instead of after it; only on "/", and only the crop this screen will show
      // (the same breakpoints as the <picture> in LandingPage's HeroArt).
      if (location.pathname === '/') {
        // AVIF only: a browser without AVIF skips the preload (type) and fetches the WebP from <picture>.
        [['/landing/hero-dusk-desktop.avif', '(min-width: 1024px)'],
         ['/landing/hero-dusk-tablet.avif', '(min-width: 600px) and (max-width: 1023.98px)'],
         ['/landing/hero-dusk-phone.avif', '(max-width: 599.98px)']].forEach(function (a) {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.type = 'image/avif'; l.href = a[0]; l.media = a[1]; l.fetchPriority = 'high';
          document.head.appendChild(l);
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <title>KaziHub</title>
    <meta name="description" content="KaziHub connects verified electricians, plumbers, AC technicians, solar installers, and carpenters with clients across all 36 Nigerian states." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
